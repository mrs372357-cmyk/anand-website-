<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANAND | My Personal Website</title>
  <meta name="description" content="Welcome to ANAND's personal website.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      line-height: 1.6;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111a35;
      border-bottom: 2px solid #00d9ff;
    }

    header h1 {
      color: #00d9ff;
      font-size: 32px;
    }

    nav {
      margin-top: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

    .hero {
      text-align: center;
      padding: 75px 20px;
      background: linear-gradient(135deg, #142850, #301860);
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero span {
      color: #00d9ff;
    }

    .hero p {
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      background: #00d9ff;
      color: #07111f;
      padding: 11px 22px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 38px 20px;
      text-align: center;
    }

    section h2 {
      color: #00d9ff;
      margin-bottom: 15px;
    }

    .card {
      max-width: 600px;
      margin: 12px auto;
      padding: 22px;
      background: #151d33;
      border-radius: 15px;
      border: 1px solid #283654;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #111a35;
      color: #b8c5dc;
    }
  </style>
</head>
<body>

  <header>
    <h1>ANAND</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#photos">Photos</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="hero" id="home">
      <h2>Welcome to <span>ANAND</span></h2>
      <p>My Personal Website 🌟</p>
      <a class="btn" href="#about">Explore More</a>
    </div>

    <section id="photos">
      <h2>📸 My Photos</h2>
      <div class="card">
        <p>ನನ್ನ ಫೋಟೋಗಳು ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತವೆ!</p>
        <p>ನಂತರ ನಿನ್ನ ಫೋಟೋ ಸೇರಿಸೋಣ.</p>
      </div>
    </section>

    <section id="about">
      <h2>🙋 About Me</h2>
      <div class="card">
        <p>Welcome to my ANAND website.</p>
        <p>ಇದು ನನ್ನ ವೈಯಕ್ತಿಕ ವೆಬ್‌ಸೈಟ್.</p>
      </div>
    </section>

    <section id="contact">
      <h2>📩 Contact</h2>
      <div class="card">
        <p>ನನ್ನ ವೆಬ್‌ಸೈಟ್‌ಗೆ ಸ್ವಾಗತ!</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 ANAND | My Website</p>
  </footer>

</body>
</html>
